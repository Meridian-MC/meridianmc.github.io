name: Refresh economy analytics

on:
  schedule:
    - cron: "*/15 * * * *"     # every 15 min (the uptime figure is only as fresh as the last run)
  workflow_dispatch: {}       # allow manual runs from the Actions tab

concurrency:
  group: analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pymysql

      - name: Rebuild public/data.json
        env:
          MC_FTP_PASSWORD: ${{ secrets.MC_FTP_PASSWORD }}
          # Optional — set these repo secrets to show live TPS + uptime on the site.
          MC_RCON_PASSWORD: ${{ secrets.MC_RCON_PASSWORD }}
          MC_RCON_HOST: ${{ secrets.MC_RCON_HOST }}
          MC_RCON_PORT: ${{ secrets.MC_RCON_PORT }}
        run: python3 scripts/refresh_analytics.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- public/data.json; then
            git config user.name  "meridian-analytics"
            git config user.email "actions@users.noreply.github.com"
            git add public/data.json
            git commit -m "chore: refresh economy analytics [skip ci]"
            git push
          else
            echo "no change"
          fi
