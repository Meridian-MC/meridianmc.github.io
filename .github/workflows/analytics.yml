name: Refresh economy analytics

on:
  # Schedule is OFF, deliberately and probably permanently.
  #
  # Apex rejects FTP logins from GitHub's runners: ~35 runs across two days all
  # returned 530 using a credential that authenticates from the Mac every time,
  # including twice after the secret was re-entered by hand. The runners DO
  # reach the server (530 is an auth rejection, not a refused connection), so
  # this reads as an IP-based restriction at Apex, not a bad secret.
  #
  # Re-enable only if Apex confirms they allow GitHub Actions IP ranges, and
  # unload com.meridian.analytics-refresh at the same time so both aren't
  # pushing. Until then the Mac LaunchAgent is the refresh path.
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch: {}       # runnable by hand to re-test

concurrency:
  group: analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pymysql

      # Allowed to fail so the status file below still gets written and committed:
      # a silently-stale site was the original problem, so the outcome is recorded
      # in the repo rather than only in a log nobody reads.
      - name: Rebuild public/data.json
        id: refresh
        continue-on-error: true
        env:
          # Prefer MC_FTP_PASSWORD_2 when it is set, falling back to the original
          # secret. Empty secrets are falsy here, so whichever one actually holds
          # the current FTP password wins.
          MC_FTP_PASSWORD: ${{ secrets.MC_FTP_PASSWORD_2 || secrets.MC_FTP_PASSWORD }}
          # Which secret supplied it, recorded in data-status.json for diagnosis.
          # Names and set/unset only: never a value.
          MC_FTP_SOURCE: ${{ secrets.MC_FTP_PASSWORD_2 != '' && 'MC_FTP_PASSWORD_2' || (secrets.MC_FTP_PASSWORD != '' && 'MC_FTP_PASSWORD' || 'neither-is-set') }}
          # Optional — set these repo secrets to show live TPS on the site.
          MC_RCON_PASSWORD: ${{ secrets.MC_RCON_PASSWORD }}
          MC_RCON_HOST: ${{ secrets.MC_RCON_HOST }}
          MC_RCON_PORT: ${{ secrets.MC_RCON_PORT }}
          # Publish straight to the game server's public webserver, which is
          # what the Worker reads at /api/data.json. Without this the live path
          # only ever updates from the Mac.
          MC_PUBLISH_PATH: profile_orfqa/plugins/squaremap/web/data.json
        run: python3 scripts/refresh_analytics.py

      - name: Commit if changed
        if: always()
        run: |
          if ! git diff --quiet -- public/data.json public/data-status.json; then
            git config user.name  "meridian-analytics"
            git config user.email "actions@users.noreply.github.com"
            git add public/data.json public/data-status.json
            git commit -m "chore: refresh economy analytics [skip ci]"
            git pull --rebase --autostash
            git push
          else
            echo "no change"
          fi

      - name: Surface the refresh failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::error::Analytics refresh failed. See public/data-status.json for the reason."
          exit 1
