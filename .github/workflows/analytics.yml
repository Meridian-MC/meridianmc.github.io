name: Refresh economy analytics

on:
  schedule:
    - cron: "23 */2 * * *"     # every 2 hours
  workflow_dispatch: {}       # allow manual runs from the Actions tab

concurrency:
  group: analytics
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pymysql

      - name: Rebuild data.json
        env:
          MC_FTP_PASSWORD: ${{ secrets.MC_FTP_PASSWORD }}
        run: python3 scripts/refresh_analytics.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data.json; then
            git config user.name  "meridian-analytics"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "chore: refresh economy analytics [skip ci]"
            git push
          else
            echo "no change"
          fi
